<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        input:focus {
            outline: 2px solid blue;
        }
        input:valid {
            border: 2px solid green;
        }
        input:invalid
        {
            border: 2px solid red;
        }
        label {
            display: block;
            margin-bottom: 10px;
        }
        
    </style>
</head>
<body>
    <header>>
        <h1> Accessible Forms </h1>
    </header>
    <main>
        <section>
            <h2> Accessible Form Example </h2>
            <form id="myform" method="post">
                <fieldset>
                    <legend>Give us your information</legend>
                    <label for="username">
                        What is your username?
                        <input type="text" id="username" required>
                    </label>
                    <label for="email">
                        What is your email?
                        <input type="email" id="email" required>
                    </label>
                    <label for="password">
                        What is your password?
                        <input type="password" id="password" required maxlength="20" minlength="8" pattern="(?=.\d)(?=.*[a-z])(?=.*[A-Z])(?=.*[a#$%^&+!=]).*" required>
                        <label>
                            <ul class="input requirements">Password must contain at least one digit, one lowercase letter, one uppercase letter, and one special character.</ul>
                        </label>
                    </label>
                   
                    <label for="website">
                        What is your website?
                        <input type="url" id="website">
                    </label>
                    <label for="age">
                        What is your age?
                        <input type="number" id="age" min="0" max="120">
                    </label>
                    <label for="phone">
                        What is your phone number?
                        <input type="tel" id="phone" minlength="7">
                    </label>
                     <input type="submit" value="Submit">
                </fieldset>

            </form>

                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required><br><br>

                <label for="email">Email:</label>

                <textarea id="message" name="message" rows="4" cols="50" required></textarea><br><br>

                <input type="submit" value="Submit">
            </form> -->
        </section>


</body>
</html>
